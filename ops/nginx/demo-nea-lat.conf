server {
    listen 80;
    listen 443 ssl;
    server_name demo.nea.lat;

    ssl_certificate /etc/nginx/ssl/nea.lat.pem;
    ssl_certificate_key /etc/nginx/ssl/nea.lat.key;
    ssl_session_cache off;

    root /srv/nea-revive/current/frontend/voxweb/dist;
    index index.html;

    location = / {
        return 302 /start.html?nea=/api/createSession;
    }

    # Session creation, map state, and all control APIs stay dynamic.
    location /api/ {
        proxy_pass http://127.0.0.1:14323;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding $http_accept_encoding;
        proxy_read_timeout 60s;
    }

    # Content-addressed project assets are immutable and CDN-safe.
    location /assets/ {
        proxy_pass http://127.0.0.1:14323;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header CDN-Cache-Control "public, max-age=31536000, immutable" always;
        add_header Surrogate-Control "max-age=31536000" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location /engine/m/ {
        proxy_pass http://127.0.0.1:14323;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header CDN-Cache-Control "public, max-age=31536000, immutable" always;
        add_header Surrogate-Control "max-age=31536000" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location /avatar/m/ {
        proxy_pass http://127.0.0.1:14323;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header CDN-Cache-Control "public, max-age=31536000, immutable" always;
        add_header Surrogate-Control "max-age=31536000" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location /api/mesh-decoded/ {
        proxy_pass http://127.0.0.1:14323;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header CDN-Cache-Control "public, max-age=31536000, immutable" always;
        add_header Surrogate-Control "max-age=31536000" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # WASM needs an explicit MIME type for WebAssembly and edge caching.
    location ~* \.wasm$ {
        types { application/wasm wasm; }
        default_type application/wasm;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header CDN-Cache-Control "public, max-age=31536000, immutable" always;
        add_header Surrogate-Control "max-age=31536000" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Hashed JS and copied media are served by Nginx and cached at the edge.
    location ~* \.(?:wasm|js|css|png|jpe?g|webp|gif|mp3|ogg|wav|gltf|bin)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header CDN-Cache-Control "public, max-age=31536000, immutable" always;
        add_header Surrogate-Control "max-age=31536000" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /ws {
        proxy_pass http://127.0.0.1:14323;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    location / {
        try_files $uri $uri/ /start.html?nea=/api/createSession;
    }
}
